name: Feature request
description: 提出游戏体验、剧情或开发工具的改进建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你希望玩家或开发者完成什么事情？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述理想行为或剧情设想。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - Gameplay
        - Story/content
        - Mobile UI/UX
        - Accessibility
        - Developer tooling
        - Documentation
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 怎样判断这项改动已经完成？
