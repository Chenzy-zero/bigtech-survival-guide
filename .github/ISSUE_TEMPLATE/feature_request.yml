name: Feature or requirement
description: 提出产品需求、游戏功能或文档改动
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景与问题
      description: 为什么需要这项改动？
    validations:
      required: true
  - type: textarea
    id: target_paths
    attributes:
      label: 对应的仓库文档/代码路径
      description: 必须填写真实存在的路径。若要新增文件，请引用相关设计文档并列出拟新增路径。
      placeholder: "docs/game-design.md；src/engine/game.ts（如尚不存在，请说明计划新增）"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 目标与建议方案
      description: 描述理想行为和本次范围。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用可检查的完成条件。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - Product requirements
        - Story/content
        - Mobile UI/UX
        - Game engine
        - Research sources
        - AI workflow/tooling
        - Documentation
    validations:
      required: true
