name: Bug report
description: 报告游戏、剧情数据或开发流程中的问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "请先搜索现有 Issues。剧情问题尽量提供事件 ID。"
  - type: input
    id: target_path
    attributes:
      label: 对应的仓库文档/代码路径
      description: 必须填写真实存在的路径。
      placeholder: "src/engine/game.ts 或 docs/game-design.md"
    validations:
      required: true
  - type: input
    id: event_id
    attributes:
      label: 事件 ID（如适用）
      placeholder: "例如 probation-001"
  - type: textarea
    id: summary
    attributes:
      label: 实际问题
      description: 清楚描述发生了什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: "1. 开始游戏……"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: 设备/浏览器
      options:
        - iPhone Safari
        - Android Chrome
        - Desktop Chrome
        - Other
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可添加截图、控制台错误或相关链接。
