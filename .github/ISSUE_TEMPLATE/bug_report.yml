name: Bug report
description: 报告游戏或开发流程中的问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "提交前请检查问题是否已存在。涉及剧情时请提供事件 ID。"
  - type: input
    id: event_id
    attributes:
      label: 事件 ID（如适用）
      placeholder: "例如 probation-001"
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 清楚描述实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: "1. 开始游戏……"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: 设备/浏览器
      options:
        - iPhone Safari
        - Android Chrome
        - Desktop Chrome
        - Other
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可添加截图、控制台错误或相关链接。
